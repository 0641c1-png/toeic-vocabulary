 a highly _____ campaign.", "answer": "persuasive"}, {"unit": 4, "sentence": "The equipment must be checked _____ to avoid breakdowns.", "answer": "periodically"}, {"unit": 4, "sentence": "The new restaurant became _____ within six months.", "answer": "profitable"}, {"unit": 5, "sentence": "Staff members can request five days of _____ each year.", "answer": "paid leave"}, {"unit": 5, "sentence": "The supervisor asked us to _____ the files by date.", "answer": "sort"}, {"unit": 5, "sentence": "The factory increased _____ to meet rising demand.", "answer": "production"}, {"unit": 5, "sentence": "Please reply _____ because the deadline is today.", "answer": "urgently"}, {"unit": 6, "sentence": "All vehicles will undergo a safety _____ before departure.", "answer": "inspection"}, {"unit": 6, "sentence": "The manager expressed _____ about the delayed delivery.", "answer": "regret"}, {"unit": 6, "sentence": "We should _____ a larger audience for the new service.", "answer": "seek"}, {"unit": 6, "sentence": "The cast will _____ the presentation this afternoon.", "answer": "rehearse"}, {"unit": 7, "sentence": "The shipment arrived _____ despite the storm.", "answer": "on schedule"}, {"unit": 7, "sentence": "The committee will _____ a new training program.", "answer": "propose"}, {"unit": 7, "sentence": "The company has built a strong _____ for reliability.", "answer": "reputation"}, {"unit": 7, "sentence": "Please _____ a copy of the receipt for your records.", "answer": "retain"}, {"unit": 8, "sentence": "The company will _____ access to the building after 8 p.m.", "answer": "restrict"}, {"unit": 8, "sentence": "All applicants must demonstrate English _____.", "answer": "proficiency"}, {"unit": 8, "sentence": "The train delay caused a long traffic _____ near the station.", "answer": "backup"}, {"unit": 8, "sentence": "We need an _____ supplier if the first one is unavailable.", "answer": "alternate"}, {"unit": 9, "sentence": "Employees must obtain _____ before using the conference room.", "answer": "permission"}, {"unit": 9, "sentence": "Please _____ the signed contract to the receptionist.", "answer": "hand over"}, {"unit": 9, "sentence": "The company will cover the cost of your university _____.", "answer": "tuition"}, {"unit": 9, "sentence": "The delivery team will _____ the boxes at the loading dock.", "answer": "unload"}, {"unit": 10, "sentence": "The committee agreed to _____ the proposed policy.", "answer": "adopt"}, {"unit": 10, "sentence": "All visitors should be _____ of the security rules.", "answer": "aware"}, {"unit": 10, "sentence": "The museum is a _____ institution with an international reputation.", "answer": "prestigious"}, {"unit": 10, "sentence": "This meeting room is _____ for up to twenty people.", "answer": "suitable"}, {"unit": 11, "sentence": "Please submit the request _____ the company policy.", "answer": "in accordance with"}, {"unit": 11, "sentence": "The two departments will _____ on the new project.", "answer": "cooperate"}, {"unit": 11, "sentence": "The revised contract will _____ the deadline by one month.", "answer": "extend"}, {"unit": 11, "sentence": "Prices tend to _____ throughout the year.", "answer": "fluctuate"}, {"unit": 12, "sentence": "We will _____ the supplier proposals before making a decision.", "answer": "evaluate"}, {"unit": 12, "sentence": "The hotel plans to _____ its guest rooms next spring.", "answer": "refurbish"}, {"unit": 12, "sentence": "Could you _____ the report before the meeting?", "answer": "run through"}, {"unit": 12, "sentence": "The laboratory uses _____ equipment for its research.", "answer": "state-of-the-art"}];
const KEY='toeic-trainer-u1-12-v1';let saved={wrong:[],correct:0,attempts:0};try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){};
let tab='home',unit='all',cardIndex=0,flipped=false,deck=[],questions=[],qIndex=0,answered=false,score=0,quizType='quiz',weakOnly=false;
const $=x=>document.querySelector(x),escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wr=w=>WORDS.find(x=>x.word===w),shuffle=a=>[...a].sort(()=>Math.random()-.5);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
function selectUnit(){return `<div class="field"><label for="unit">学習範囲</label><select id="unit"><option value="all" ${unit==='all'?'selected':''}>全Unit（192語）</option>${Object.keys(TITLES).map(n=>`<option value="${n}" ${unit===n?'selected':''}>Unit ${n}：${escapeHtml(TITLES[n])}</option>`).join('')}</select></div>`}
function setUnit(){unit=$('#unit')?.value||'all';cardIndex=0;flipped=false;render()}
function list(){return WORDS.filter(w=>unit==='all'||String(w.unit)===unit)}
function shell(title,body){$('#content').innerHTML=`<section><h2>${title}</h2>${body}</section>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')home();if(tab==='cards')cards();if(tab==='quiz')quizIntro();if(tab==='part5')partIntro()}
function changeTab(t){tab=t;questions=[];render()}
function home(){const wrong=saved.wrong.filter(w=>WORDS.some(x=>x.word===w));shell('学習メニュー',`<div class="stats"><div class="stat"><strong>192</strong><span>収録単語</span></div><div class="stat"><strong>${saved.attempts}</strong><span>累計回答数</span></div><div class="stat"><strong>${wrong.length}</strong><span>復習単語</span></div></div><p class="muted">Unitごとに学習したり、全Unitを混ぜて復習したりできます。まずはUnitを選んで始めましょう。</p><div class="unitGrid">${Object.entries(TITLES).map(([n,name])=>`<button class="unitTile" data-unit="${n}"><b>Unit ${n}</b><span>${escapeHtml(name)}</span></button>`).join('')}</div><div class="actions"><button class="btn" id="startall">全Unitの単語カード</button><button class="btn secondary" id="weak">苦手語だけ復習 (${wrong.length})</button></div><p class="muted">問題演習は上部の「4択クイズ」「TOEIC問題」から選べます。</p><div class="actions"><button class="btn secondary" id="reset">学習履歴を消去</button></div>`);document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{unit=b.dataset.unit;changeTab('cards')});$('#startall').onclick=()=>{unit='all';weakOnly=false;changeTab('cards')};$('#weak').onclick=()=>{unit='all';weakOnly=true;changeTab('cards')};$('#reset').onclick=()=>{if(confirm('この端末の学習履歴をすべて消去しますか？')){saved={wrong:[],correct:0,attempts:0};persist();render()}}}
function cards(){let items=list().filter(w=>!weakOnly||saved.wrong.includes(w.word));if(!items.length){shell('単語カード',`<div class="controls">${selectUnit()}</div><div class="empty">${weakOnly?'まだ復習対象の単語がありません。':'対象の単語がありません。'}</div><button class="btn secondary" id="normal">通常の単語カードへ</button>`);$('#unit').onchange=setUnit;$('#normal').onclick=()=>{weakOnly=false;render()};return}if(cardIndex>=items.length)cardIndex=0;const w=items[cardIndex];shell('単語カード',`<div class="controls">${selectUnit()}<div class="field"><label>表示順</label><span class="pill">${weakOnly?'苦手語':'教材の掲載順'}</span></div></div><div class="flash" id="flash" role="button" tabindex="0" aria-label="カードをめくる"><div class="counter">UNIT ${w.unit} · ${w.no}/16 · ${cardIndex+1}/${items.length}</div>${flipped?`<div class="meaning">${escapeHtml(w.meaning)}</div><div class="hint">${escapeHtml(w.word)}</div>`:`<div class="word">${escapeHtml(w.word)}</div><div class="hint">タップで日本語訳を表示</div>`}</div><div class="actions"><button class="btn secondary" id="prev">← 前へ</button><button class="btn" id="flip">${flipped?'英語に戻す':'日本語訳を見る'}</button><button class="btn secondary" id="next">次へ →</button></div><div class="actions"><button class="btn secondary" id="bookmark">${saved.wrong.includes(w.word)?'復習リストから外す':'苦手語として登録'}</button>${weakOnly?'<button class="btn secondary" id="allcards">通常のカードへ</button>':''}</div>`);$('#unit').onchange=()=>{weakOnly=false;setUnit()};const flip=()=>{flipped=!flipped;cards()};$('#flash').onclick=flip;$('#flash').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('#flip').onclick=flip;$('#prev').onclick=()=>{cardIndex=(cardIndex-1+items.length)%items.length;flipped=false;cards()};$('#next').onclick=()=>{cardIndex=(cardIndex+1)%items.length;flipped=false;cards()};$('#bookmark').onclick=()=>{saved.wrong=saved.wrong.includes(w.word)?saved.wrong.filter(x=>x!==w.word):[...saved.wrong,w.word];persist();cards()};if($('#allcards'))$('#allcards').onclick=()=>{weakOnly=false;cards()}}
function quizIntro(){if(questions.length)return questionView();shell('日本語訳 4択クイズ',`<p class="muted">英単語に合う日本語訳を4つから選びます。間違えた単語は自動的に復習リストへ追加されます。</p><div class="controls">${selectUnit()}<div class="field"><label for="count">問題数</label><select id="count"><option value="10">10問</option><option value="16">16問</option><option value="30">30問</option><option value="all">全問</option></select></div></div><div class="actions"><button class="btn" id="go">テスト開始</button><button class="btn secondary" id="retry">苦手語だけ出題 (${saved.wrong.length})</button></div>`);$('#unit').onchange=setUnit;$('#go').onclick=()=>beginQuiz(false);$('#retry').onclick=()=>beginQuiz(true)}
function beginQuiz(weak){let pool=list().filter(w=>!weak||saved.wrong.includes(w.word));if(!pool.length){alert('対象の単語がありません。');return}let cap=$('#count')?.value||'10';questions=shuffle(pool).slice(0,cap==='all'?pool.length:Number(cap)).map(w=>({word:w.word,correct:w.meaning,options:shuffle([w.meaning,...shuffle(WORDS.filter(x=>x.word!==w.word&&x.meaning!==w.meaning)).slice(0,3).map(x=>x.meaning)]),unit:w.unit}));qIndex=0;score=0;quizType='quiz';answered=false;questionView()}
function partIntro(){if(questions.length)return questionView();shell('TOEIC Part 5 形式',`<p>ビジネス場面の英文を読み、空欄に最も適切な語句を選びます。</p><p class="muted">全48問のオリジナル練習問題です。教材の公式TOEIC問題を転載したものではありません。</p><div class="controls">${selectUnit()}<div class="field"><label for="count">問題数</label><select id="count"><option value="10">10問</option><option value="16">16問</option><option value="all">全問</option></select></div></div><button class="btn" id="go">TOEIC問題を開始</button>`);$('#unit').onchange=setUnit;$('#go').onclick=beginPart}
function beginPart(){let pool=PART5.filter(x=>unit==='all'||String(x.unit)===unit),cap=$('#count')?.value||'10';questions=shuffle(pool).slice(0,cap==='all'?pool.length:Number(cap)).map(p=>{let distractors=shuffle(WORDS.filter(w=>w.unit===p.unit&&w.word!==p.answer)).slice(0,3).map(w=>w.word);return{sentence:p.sentence,word:p.answer,correct:p.answer,options:shuffle([p.answer,...distractors]),unit:p.unit}});quizType='part5';qIndex=0;score=0;answered=false;questionView()}
function questionView(){if(qIndex>=questions.length)return results();const q=questions[qIndex];shell(quizType==='quiz'?'日本語訳 4択クイズ':'TOEIC Part 5 形式',`<div class="counter">問題 ${qIndex+1} / ${questions.length}　· Unit ${q.unit}</div><div style="height:7px;background:#e7edf5;border-radius:10px;margin:15px 0"><div style="background:#e8b916;height:7px;border-radius:10px;width:${100*qIndex/questions.length}%"></div></div>${quizType==='quiz'?`<div class="qword">${escapeHtml(q.word)}</div><p class="muted">最も適切な日本語訳を選んでください。</p>`:`<div class="question">${escapeHtml(q.sentence).replace('_____','<span style="color:#1d659b">________</span>')}</div><p class="muted">Select the best answer.</p>`}<div class="answers">${q.options.map((s,i)=>`<button class="answer" data-answer="${i}"><b>${'ABCD'[i]}.</b> ${escapeHtml(s)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="actions"><button class="btn" id="next" disabled>${qIndex===questions.length-1?'結果を見る':'次の問題へ →'}</button></div>`);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.answer)) );$('#next').onclick=()=>{qIndex++;answered=false;questionView()}}
function choose(index){if(answered)return;answered=true;const q=questions[qIndex],guess=q.options[index],right=guess===q.correct;score+=Number(right);saved.attempts++;saved.correct+=Number(right);if(right){saved.wrong=saved.wrong.filter(w=>w!==q.word)}else if(!saved.wrong.includes(q.word)){saved.wrong.push(q.word)}persist();document.querySelectorAll('[data-answer]').forEach((b,i)=>{b.disabled=true;if(q.options[i]===q.correct)b.classList.add('correct');else if(i===index)b.classList.add('wrong')});let w=wr(q.word);$('#feedback').innerHTML=`<div class="feedback ${right?'okay':'bad'}">${right?'正解！':'不正解。'}　正解：${escapeHtml(q.correct)}${quizType==='part5'?`<div class="small">${escapeHtml(q.word)}：${escapeHtml(w?.meaning||'')}</div>`:''}</div>`;$('#next').disabled=false}
function results(){shell('結果',`<div class="stat"><strong style="font-size:36px">${score} / ${questions.length}</strong><span>正答率 ${Math.round(100*score/questions.length)}%</span></div><p class="muted">間違えた単語はホームの「苦手語だけ復習」から繰り返し学習できます。</p><div class="actions"><button class="btn" id="again">もう一度テスト</button><button class="btn secondary" id="cards">単語カードへ</button></div>`);$('#again').onclick=()=>{questions=[];render()};$('#cards').onclick=()=>{questions=[];weakOnly=true;cardIndex=0;changeTab('cards')}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{weakOnly=false;cardIndex=0;changeTab(b.dataset.tab)});render();
</script></body></html>
